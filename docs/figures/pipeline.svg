  <line x1="774" y1="128.0" x2="792" y2="128.0" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M882.0 216 L882.0 236 L170 236 L170 258" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="10" y="252" font-size="12" font-weight="600" letter-spacing=".05em" fill="#52514e">6 · KEEP</text>
  <text x="370" y="252" font-size="12" font-weight="600" letter-spacing=".05em" fill="#52514e">7 · ANALYSE</text>
  <text x="690" y="252" font-size="12" font-weight="600" letter-spacing=".05em" fill="#52514e">8 · PUBLISH</text>
  <rect x="10" y="260" width="320" height="150" rx="8" fill="#cde2fb" stroke="#2a78d6"/>
  <text x="22" y="282" font-size="13" font-weight="600" fill="#0b0b0b">12.3 GB regional archive</text>
  <text x="22" y="306" font-size="12" fill="#52514e">analysis-ready: one file per source,</text>
  <text x="22" y="322" font-size="12" fill="#52514e">variable, region and year;</text>
  <text x="22" y="338" font-size="12" fill="#52514e">about 1.5% of an estimated</text>
  <text x="22" y="354" font-size="12" fill="#52514e">700–900 GB streamed</text>
  <text x="22" y="400" font-size="11" fill="#2a78d6">store.py</text>
  <rect x="370" y="260" width="280" height="150" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="382" y="282" font-size="13" font-weight="600" fill="#0b0b0b">Analysis library</text>
  <text x="382" y="306" font-size="12" fill="#52514e">climatology · nao · extremes</text>
  <text x="382" y="322" font-size="12" fill="#52514e">relationships · events</text>
  <text x="382" y="338" font-size="12" fill="#52514e">provenance · plotting</text>
  <text x="382" y="354" font-size="12" fill="#52514e">same code for every dataset</text>
  <text x="382" y="400" font-size="11" fill="#2a78d6">src/eerie_uk/</text>
  <line x1="330" y1="335" x2="368" y2="335" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="690" y="260" width="300" height="46" rx="8" fill="#e2def7" stroke="#4a3aa7"/>
