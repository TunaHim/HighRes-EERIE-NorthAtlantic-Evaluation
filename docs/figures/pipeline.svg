  <text x="702" y="296" font-size="12" fill="#52514e">generated by scripts, executed</text>
  <line x1="650" y1="335" x2="688" y2="283" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="690" y="312" width="300" height="46" rx="8" fill="#e2def7" stroke="#4a3aa7"/>
