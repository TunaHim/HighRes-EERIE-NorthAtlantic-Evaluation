name: eerie-uk-nao
channels:
  - conda-forge
dependencies:
  - python=3.11
  - xarray
  - dask
  - zarr
  - intake
  - intake-xarray
  - intake-esm
  - aiohttp
  - requests
  - fsspec
  - cftime
  - matplotlib
  - cartopy  # optional: maps only
  - jupyterlab
  - nbconvert
  - pytest
  - pip
  - pip:
      - gribscan  # brings eccodes, needed to decode the IFS GRIB chunks
